<!doctype html>
<html lang="en" class="dark" style="background-color: #0d0d12 !important; color-scheme: dark !important;">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0d12" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CERBERUS-X | Where Evidence Meets Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root, html, body, #root {
        background-color: #0d0d12 !important;
        color: #ffffff !important;
        color-scheme: dark !important;
        min-height: 100vh;
      }
      /* Suppress Netlify badge, drawer, and injected banners */
      #netlify-drawer,
      [data-netlify-drawer],
      .netlify-badge,
      iframe[src*="netlify"],
      div[id*="netlify"],
      div[class*="netlify"],
      a[href*="netlify.com"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        overflow: hidden !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      (function() {
        function purgeNetlifyBadge() {
          const selectors = [
            '#netlify-drawer',
            '[data-netlify-drawer]',
            '.netlify-badge',
            'iframe[src*="netlify"]',
            'a[href*="netlify.com"]',
            'div[id*="netlify-drawer"]',
            'div[class*="netlify-drawer"]'
          ];
          selectors.forEach(function(sel) {
            try {
              document.querySelectorAll(sel).forEach(function(el) {
                el.remove();
              });
            } catch (e) {}
          });
        }
        purgeNetlifyBadge();
        try {
          const observer = new MutationObserver(purgeNetlifyBadge);
          if (document.body) {
            observer.observe(document.body, { childList: true, subtree: true });
          } else {
            window.addEventListener('DOMContentLoaded', function() {
              purgeNetlifyBadge();
              if (document.body) {
                observer.observe(document.body, { childList: true, subtree: true });
              }
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="background-color: #0d0d12 !important; color: #ffffff !important;" class="bg-[#0d0d12] text-white antialiased font-sans min-h-screen selection:bg-slate-700 selection:text-white">
    <div id="root" style="background-color: #0d0d12 !important; min-height: 100vh;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
